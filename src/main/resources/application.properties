spring.application.name=mytaxitravel

# CONFIGURACION A LA BASE DE DATOS

# Se configura la conexion con la base de datos (se pone que si no existe la bd entonces la cree)
spring.datasource.url=jdbc:mysql://localhost:3306/my_taxi_travel?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=2004248

# Se indica el driver a la bd a utilizar
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# El dialecto de hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Como hibernate controla el esquema de bd  // Se cambia de create-drop a update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# Configuracion Actuator
management.endpoints.web.exposure.include=health, info
management.endpoints.web.exposure.exclude= mappings, beans

management.info.env.enabled = true
info.app.name = My Taxi Travel
info.app.version = 0.0.3-SNAPSHOT
info.app.description = API REST de MyTaxiTravel realizada en Springboot

